<title>マインクエスト 完全ガイド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f4f1e6;--panel:#fffdf6;--panel2:#efe9d6;--ink:#1d2420;--sub:#5b625a;--line:#d9d1ba;
  --moss:#3f6b3a;--moss2:#2c4f29;--gold:#a8761a;--gold2:#e8b84a;--chip:#e7e0c8;--link:#2f5f8a;
  --r-F:#8a8f86;--r-E:#4f8a5b;--r-D:#3d7fa8;--r-C:#7a5bb5;--r-B:#b8742a;--r-A:#c24a3a;--r-S:#c9921a;--r-SS:#d4467e;--r-X:#7d2fd0;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(40,50,30,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16;--panel:#1c241f;--panel2:#232e27;--ink:#e8eadf;--sub:#a3ab9f;--line:#33402f;
  --moss:#7fb36f;--moss2:#9fd08c;--gold:#e8b84a;--gold2:#f3cf73;--chip:#2a352d;--link:#8cc0ea;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16;--panel:#1c241f;--panel2:#232e27;--ink:#e8eadf;--sub:#a3ab9f;--line:#33402f;
  --moss:#7fb36f;--moss2:#9fd08c;--gold:#e8b84a;--gold2:#f3cf73;--chip:#2a352d;--link:#8cc0ea;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.75;margin:0}
a{color:var(--link)}
.px{font-family:"DotGothic16","Zen Kaku Gothic New",monospace;letter-spacing:.04em}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--moss2);color:#f5f1e0;padding-block:22px 14px}
:root[data-theme="dark"] header.top{background:#0f1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0f1511}}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(26px,5vw,40px);line-height:1.1;text-wrap:balance}
.brand .ver{font-size:13px;background:var(--gold2);color:#2a2005;padding:2px 10px;border-radius:999px}
.brand p{margin:6px 0 0;color:#d9e3cf;font-size:14px;flex-basis:100%}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--moss2);border-bottom:3px solid var(--gold2)}
:root[data-theme="dark"] nav.tabs{background:#0f1511}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs{background:#0f1511}}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:#dfe8d4;font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--gold2);color:#2a2005;font-weight:700}
main{padding-block:22px 60px}
section.page{display:none}section.page.on{display:block}
h2{font-size:22px;margin:6px 0 14px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2 .px{font-size:13px;color:var(--gold);border:1px solid var(--gold);padding:0 8px;border-radius:4px}
h3{font-size:17px;margin:22px 0 8px;text-wrap:balance}
p.lead{color:var(--sub);margin:0 0 14px;max-width:70ch;overflow-wrap:anywhere}
section.page{overflow-wrap:anywhere}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.grid>*,.list>*{min-width:0}
.card h4{margin:0 0 6px;font-size:15px}
.card p{margin:4px 0;font-size:14px}
.card ul{margin:4px 0;padding-left:1.2em;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:24px;color:var(--moss)}
.stat span{display:block;font-size:12px;color:var(--sub);letter-spacing:.05em;overflow-wrap:anywhere}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:12px;background:var(--chip);border-radius:999px;padding:0 8px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.g{background:var(--gold2);color:#2a2005}.chip.m{background:var(--moss);color:#fff}.chip.n{background:transparent;border:1px solid var(--line)}
.rk{display:inline-block;min-width:28px;text-align:center;color:#fff;border-radius:5px;font-size:12px;font-weight:700;padding:0 5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.tools input{flex:1 1 220px}
.count{font-size:13px;color:var(--sub)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.item .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.item .nm{font-weight:700;font-size:15px}
.item .sm{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.item details{margin-top:6px;font-size:13px}
.item summary{cursor:pointer;color:var(--link)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:12px;align-items:center;margin:6px 0}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--moss)}
.more{display:block;margin:14px auto 0;font:inherit;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 48px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:7px;background:var(--moss);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.ol{margin:0;padding-left:1.2em}
.note{border-left:4px solid var(--gold);background:var(--panel);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14px}
.ch{display:grid;gap:10px}
.ch .card h4{color:var(--gold)}
.theme{margin-left:auto;background:transparent;border:1px solid #ffffff55;color:#f5f1e0;border-radius:999px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
.mono{font-variant-numeric:tabular-nums}
@media (max-width:520px){h2{font-size:19px}.list{grid-template-columns:1fr}}
.mrow{display:flex;gap:12px;align-items:flex-start}.mcol{min-width:0;flex:1}
.spr{flex:0 0 72px;width:72px;height:72px;background-size:720px 720px;background-repeat:no-repeat;border-radius:10px;background-color:var(--chip, rgba(127,127,127,.12));image-rendering:auto}
.pp{display:flex;gap:14px;align-items:flex-start}.pp img{flex:0 0 96px;width:96px;height:150px;object-fit:contain;image-rendering:pixelated;background:var(--chip);border-radius:10px}
.rkt td,.rkt th{padding:6px 8px;text-align:left;vertical-align:middle}.rkt .no{font-weight:900;width:2.5em;text-align:center}.rkt .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}.rkt .spr{display:block;flex:none;width:48px;height:48px;background-size:480px 480px;border-radius:8px}.rkt .bar{display:block;min-width:60px}.rkt .nm{min-width:0}@media (max-width:640px){.rkt .fm,.rkt .bc{display:none}.rkt td,.rkt th{padding:6px 5px}}.rkt tr.top1 .no{color:#c9a227}.rkt tr.top2 .no{color:#8f9aa6}.rkt tr.top3 .no{color:#b0703c}.stb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.stb button{border:1px solid var(--line);background:var(--panel);color:inherit;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}.stb button[aria-pressed="true"]{background:var(--gold2);color:#2a2005;border-color:var(--gold2);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.gal figure{margin:0;text-align:center;font-size:11px}.gal .spr{display:block;margin:0 auto 2px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 class="px">マインクエスト</h1><span class="ver px" id="ver">v—</span>
      <button class="theme" id="themeBtn" type="button" aria-label="表示の 明るさを 切り替える">◐ 明暗</button>
      <p>マイクラ統合版の モンスター育成RPG アドオン ― 遊び方・バトル・世界・クリア後・全データ図鑑</p>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="ページ"><div class="wrap" id="tabs"></div></nav>

<main class="wrap" id="main">
  <p id="loading" class="lead">データを 読み込んでいます…</p>
</main>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kata = (t) => String(t || "").replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/\s/g, "").toLowerCase();
const rk = (r) => `<span class="rk" style="background:var(--r-${r})">${r}</span>`;
const chip = (t, c = "") => `<span class="chip ${c}">${esc(t)}</span>`;
try { const th = localStorage.getItem("mq-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
$("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("mq-theme", nx); } catch {} };

const PAGES = [["home", "ホーム"], ["play", "遊び方"], ["battle", "バトル"], ["world", "世界と 物語"], ["people", "人物"], ["post", "クリア後"], ["eg", "やりこみ"], ["explore", "探索"], ["town", "町"], ["bond", "きずな"], ["minigame", "ミニゲーム"], ["guide", "おすすめ モンスター"], ["boss", "ボス攻略"], ["mons", "モンスター"], ["rank", "ランキング"], ["moves", "技"], ["skills", "スキル"], ["traits", "特性"], ["items", "道具"], ["fuse", "配合"], ["multi", "導入・マルチ"]];

fetch("mq.json").then((r) => { if (!r.ok) throw 0; return r; }).catch(() => fetch("https://raw.githubusercontent.com/JOKER05www/Mine-Quest/main/guide/mq.json")).then((r) => r.json()).then(init).catch(() => { $("#loading").textContent = "データを 読み込めませんでした。ページを 開きなおしてください。"; });

function fxPair(x) { return x[2] ? `${x[0]} → ${x[1]}（この 順に えらぶ）` : `${x[0]} × ${x[1]}`; }
function fxLines(f) {
  if (!f) return [];
  const L = [];
  if (f.sp) L.push(`特別配合: ${f.sp[0]} × ${f.sp[1]}`);
  for (const r of f.s4 || []) L.push(`4体配合: ${r.join("・")}`);
  for (const r of f.ro || []) L.push(`奇跡の配合: ${r.join(" × ")}`);
  for (const r of f.p || []) L.push(`配合: ${fxPair(r)}`);
  return L;
}
function init(D) {
  $("#ver").textContent = "v" + D.ver;
  const main = $("#main"); main.innerHTML = "";
  const tabs = $("#tabs");
  for (const [id, n] of PAGES) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.dataset.p = id; b.onclick = () => go(id); tabs.appendChild(b);
    const s = document.createElement("section"); s.className = "page"; s.id = "p-" + id; main.appendChild(s);
  }
  const built = {};
  function go(id, push = true) {
    if (!PAGES.some(([p]) => p === id)) id = "home";
    for (const b of tabs.children) b.setAttribute("aria-current", b.dataset.p === id ? "true" : "false");
    for (const s of main.children) s.classList.toggle("on", s.id === "p-" + id);
    if (!built[id]) { built[id] = 1; BUILD[id]($("#p-" + id)); }
    if (push) { try { history.replaceState(null, "", "#" + id); } catch {} window.scrollTo({ top: 0 }); }
    const cur = tabs.querySelector('[aria-current="true"]'); if (cur) cur.scrollIntoView({ inline: "center", block: "nearest" });
  }
  window.addEventListener("hashchange", () => go(location.hash.slice(1), false));

  const G = Object.fromEntries(D.gloss);
  const gcard = (t) => G[t] ? `<div class="card"><h4>${esc(t)}</h4><ul>${G[t].map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>` : "";
  const C = D.counts;

  // ---------- ページ ----------
  const BUILD = {
    home(el) {
      el.innerHTML = `
      <h2><span class="px">HOME</span>マインクエストへ ようこそ</h2>
      <p class="lead" style="border-left:4px solid var(--gold);padding-left:12px">作者より: マイクラで モンスター育成RPGを 遊びたくて、Claudeと いっしょに 作りました。思った 以上の できに なったので、ぜひ 遊んで みて ください。すべて 無料で、お金は 一切 かかりません。</p>
      <p class="lead">モンスターを スカウトして 育て、配合で 強く する RPGです。旅は アルカトラス地方の 町 ルミナに ある 自分の 家から はじまる。11の 地方を めぐり、15枚の 石板を 封印しよう。</p>
      <div class="stats">
        <div class="stat"><b class="mono">${C.mons}</b><span>モンスター</span></div><div class="stat"><b class="mono">${C.moves}</b><span>技</span></div>
        <div class="stat"><b class="mono">${C.skills}</b><span>スキル</span></div><div class="stat"><b class="mono">${C.traits}</b><span>特性（＋固有特性 ${C.mons}）</span></div>
        <div class="stat"><b class="mono">${C.items}</b><span>道具・装備</span></div><div class="stat"><b class="mono">${C.combos}</b><span>ロマン配合スキル（系統）</span></div>
      </div>
      <h3>新しく なった こと</h3>
      <div class="card"><h4>第103版: モンスターと あそぶ（ミニゲーム 30）</h4><ul><li>ガイドブック → 冒険 →「モンスターと あそぶ」。仲間が 目の 前で 動く かけっこ・すもう・ダンス・鬼ごっこ・かくれんぼ・クイズ・すごろく など 30種類（<a href="#minigame">くわしく</a>）</li><li>ゲームの 中で アップデート情報が 見られる（冒険 → 遊び方 → アップデート情報）</li><li>用語の 説明を 実際の 数値に 合わせて 直した・見つかった 不具合と 重さを 直した</li></ul></div>
      <div class="card"><h4>第102版: 町・きずな・探索の 追加</h4><ul><li>町の 広場（依頼・くじ・お祭り・発展度）・<a href="#town">町</a></li><li>なつき度 5段階・好物・思い出・<a href="#bond">きずな</a></li><li>探索の 新しい 場所 24種・料理と 畑・レース など（<a href="#explore">探索</a>）</li></ul></div>
      <h3>はじめの 一歩</h3>
      <ol class="steps">
        <li>アドオン（本体）を 入れて ワールドを 作る。ルミナの 自分の 家から スタート</li>
        <li>ガイドブックを 使って 最初の 仲間を えらぶ。メニューは すべて ガイドブックから</li>
        <li>草原の モンスターを なぐると バトル。HPを けずって スカウトしよう</li>
        <li>レベルアップで もらえる SP（スキルポイント）を スキルに 振って 技と 能力を 覚える</li>
        <li>アルカトラス城の 地方マスターに 勝つと 最初の 石板「苔むしの石板」が もらえる</li>
        <li>石板を 使うと 中の 世界へ 入れる。奥に いる 主を 倒すと 封印。15枚 ぜんぶ 封印し、闘技場の 星冠王にも 勝つと エンディング</li>
      </ol>
      <h3>マインクエストの 特色</h3>
      <div class="grid">
        <div class="card"><h4>10の 系統・${C.mons}体</h4><p>粘液・獣・動物・海・無機物・ネザー・武者・竜・王・神。鳥や 虫、植物、熊・虎・狼は <b>動物系</b>、悪魔や 死者、ネザーの 住民は <b>ネザー系</b>。</p></div>
        <div class="card"><h4>王と 神</h4><p>王は 全員 SSランクで、名前は「〇王」。2〜3回 行動する。神は 全員 Xランク。配合で 生まれる 神は 3〜4回 行動する。神の石板（クリア後）の 神 15柱は 配合では 生まれず、2〜3回 行動。神は それぞれ 色の ちがう 後光を まとう。</p></div>
        <div class="card"><h4>配合の 楽しみ</h4><p><b>ロマン配合</b>（親の スキルの 組み合わせで 生まれる ${C.combos}系統の スキル）・<b>奇跡の配合</b>（決まった 2体から 思わぬ モンスター）・<b>4体配合</b>（王と 神）。</p></div>
        <div class="card"><h4>地方ごとの 景色</h4><p>草原と 花畑の アルカトラス、苔と 泥の 湿地帯 シルヴァ、黒い 岩の 火山 ヴォルカ…。地方ごとに 地面や 草木が かわる。町の 中には 水が 流れこまない。</p></div>
        <div class="card"><h4>読みやすい 太字</h4><p>マインクエストを 入れると ゲームの 日本語が 太く 見やすい 字に なる（いらない ときは フォントの パックだけ はずせる）。</p></div>
        <div class="card"><h4>こまったら「バグを 直す」</h4><p>ガイドブック → 冒険 →「バグを 直す」で、戦いの あとに 画面が 残った、物語が 進まない、などの ときに その場で 直せる。</p></div>
      </div>
      <p><a href="#guide">ストーリーで 役立つ おすすめの モンスター →</a></p>`;
    },
    play(el) {
      el.innerHTML = `
      <h2><span class="px">PLAY</span>遊び方</h2>
      <div class="card" style="border:2px solid var(--gold2);margin-bottom:16px"><h4>⚠ 注意書き（はじめに 読もう）</h4><ul>
        <li><b>戦いで 使える 技は 6つまで。</b> 技は いくつでも 覚えられるが、戦いに 出せるのは 6つだけ。<b>作戦</b> → モンスター → <b>戦いで 使う 技（6つ）</b> で えらぶ。えらばない ときは 自動で 6つ きまる。</li>
        <li><b>パーティは 4体 ではなく 4枠。</b> S=1枠・M=2枠・L=3枠・G=4枠。Gサイズは 1体で いっぱい。</li>
        <li><b>配合すると 親の 2体は いなくなる。</b> 子は 親の スキルや プラス値を 引きつぐ。</li>
        <li><b>物語の とちゅうは レベルが 上がりにくい ことが ある。</b> レベルが「次の 石板の 主の Lv＋2」を こえると、もらえる 経験値が 10分の1に なる。石板を 封印すると この 上限が 上がる。エンディング後は 上限なし。</li>
        <li><b>野生や ボスに 負けると お金が 半分</b>になり、近くの 町の 宿屋で 目を さます（全回復）。物語の 戦いや 石板の 中では 宿屋へは 行かない。こうさん・時間切れ・闘技場では お金は へらない。</li>

      <div class="card"><h4>段階と 効果</h4><ul><li>なかよし（80）: 戦いで 倒れそうな とき 10% 踏みとどまる・いっしょに 釣ると たまに 1ぴき おまけ</li><li>相棒（250）: 20% 踏みとどまる・戦いの はじめに かけ声・あぶない 生き物を 知らせる・ライド +2%</li><li>親友（600）: 30% 踏みとどまる・回避 +1・宝の においを かぎつける・プレゼント・ライド +4%</li><li>家族（900）: 命中 +1・ライド +6%</li><li>パーティ 全員が 相棒 以上: 硬力 +1（きずなの 力）</li></ul></div>
      <div class="card"><h4>思い出</h4><ul><li>1体ごとの 記録: 仲間に なった 日と 場所・いっしょに いた 日数・歩いた きょり・戦った 回数・勝った 強敵・成長・ひとことメモ</li><li>配合で いなく なった 子は「思い出の 仲間」に のこり、生まれた 子が きずなの 半分を 受けつぐ</li><li>きずなランキング: 仲間を 自慢すると ワールドの 掲示板に のる</li></ul></div>`;

    minigame(el) {

        ["あたま", "能力は 関係なし。考える 力と 知識で 勝負", [["属性じゃんけん", "", "火は 木に、木は 水に、水は 火に 強い。先に 3勝"], ["ハイ＆ロー", "", "次の モンスターの 強さが 上か 下か。4連続で 勝ち"], ["図鑑クイズ", "", "系統・ランク・大きさ・得意な 属性から 名前を 当てる（5問中 3問）"], ["弱点クイズ", "", "モンスターの 弱点の 属性を 当てる（5問中 3問）"], ["技の 属性クイズ", "", "技の 属性を 当てる（5問中 3問）"], ["神経衰弱", "", "12枚の カードで 6組 そろえる（めくれるのは 12回）"], ["ダンス", "", "仲間が 目の 前で おどる 順番を 見て おぼえ、同じ 順に 答える（3・4・5こ）"], ["数あて", "", "1〜15の 数を 4回で 当てる（大きい・小さいの ヒント）"], ["三目並べ", "", "たて・よこ・ななめに 3つ ならべる"], ["石とり", "", "1〜3こずつ とる。最後の 1こを とった ほうが 負け"]]],
        ["あそび場", "カード・ボード・外あそび", [["モンスターカード", "", "パーティの 子を カードに して 能力くらべ（3回勝負）"], ["すごろく", "", "20マス。相手より 先に ゴール"], ["宝さがし", "", "目の 前の 3×3の 地面を 3回 ほる（仲間が 走って いって ほる）。「近い・遠い」の ヒントつき"], ["かくれんぼ", "", "仲間が 近くに 透明に なって かくれる。画面の 下の「あつい・つめたい」と 緑の キラキラを たよりに 60秒で さがして タッチ"], ["迷路", "", "4×4の 迷路を 24歩で ぬける"], ["21", "", "モンスターの ランク（F=1〜S=7）を 足して 21に 近づける"], ["料理コンテスト", "", "審査員の 好きな 味の 材料を 入れる"], ["モンスターコンテスト", "", "かっこよさ・かしこさ・たくましさ・かわいさ を アピール"], ["ボール遊び", "走力", "投げ方で 点が かわる。9点で 勝ち"], ["鬼ごっこ", "走力", "仲間が 本当に にげる。40秒で 追いかけて 近くで タッチ（走力が 高い 子ほど 速い）"]]]];
      el.innerHTML = `<h2><span class="px">MINIGAME</span>モンスターと あそぶ</h2>
      <p>ガイドブック → 冒険 →「モンスターと あそぶ」。パーティの 仲間と 遊ぶ ミニゲームが 30種類。<b>遊ぶ 仲間（と ライバル）が 目の 前に 出て、本当に 走ったり 泳いだり おどったり する。</b>鬼ごっこと かくれんぼは 画面を とじて 自分で 走り、近くで なぐって（タッチして）つかまえる。ひらけた 場所で 遊ぼう（ライドからは おりてから）。動かすのは 遊んで いる 間だけで、終わると すぐ 片づく。</p>
      <div class="card"><h4>ほうび</h4><ul><li>それぞれの 遊びで 1日 1回、はじめて 勝つと お金（300 + 仲間の Lv×8）と なつき度 +3</li><li>その日に 5種類 勝つごとに 道具 1つ</li><li>称号: 遊び 上手（10回）・遊びの 達人（100回）・遊びの 王様（30種類 ぜんぶ）</li><li>2回目 からは ほうび なしで 何度でも 遊べる</li></ul></div>
      ${G3.map(([h, d, L]) => `<h3>${esc(h)}（${L.length}）</h3><p class="lead">${esc(d)}</p><div class="grid">${L.map(([n, k, t]) => `<div class="card"><h4>${esc(n)}${k ? ` <span class="sm" style="color:var(--sub)">${esc(k)}</span>` : ""}</h4><p class="sm">${esc(t)}</p></div>`).join("")}</div>`).join("")}`;
    },
    guide(el) {
      const spr = (m) => `<span class="spr" role="img" aria-label="${esc(m.n)}の すがた" style="background-image:url(img/s${Math.floor(m.i / 100)}.webp);background-position:${-(m.i % 10) * 72}px ${-Math.floor((m.i % 100) / 10) * 72}px"></span>`;
      const regs = [...new Set(D.story.map((x) => x.reg))];
      const st = (x) => `<div class="item"><div class="mrow">${spr(x)}<div class="mcol"><div class="hd">${rk(x.r)}<span class="nm">${esc(x.n)}</span>${chip(x.f)}${x.ro ? chip(x.ro, "m") : ""}${x.ks ? chip("奇跡の配合", "g") : ""}</div>
        <div class="sm">${rk(x.ra)} ${esc(x.a)} ${x.o ? "→" : "×"} ${rk(x.rb)} ${esc(x.b)}${x.o ? "（この 順に えらぶ）" : ""}</div>${x.cm ? `<div class="sm" style="color:var(--sub)">「${esc(x.cm)}」</div>` : ""}</div></div></div>`;
      const sy = (x) => `<div class="item"><div class="mrow">${spr(x)}<div class="mcol"><div class="hd">${rk(x.r)}<span class="nm">${esc(x.n)}</span>${chip(x.f)}${x.cat ? chip(x.cat, "m") : ""}${x.el ? chip(x.el) : ""}${x.wx ? chip(x.wx, "n") : ""}</div>
        <ul class="ol" style="margin:4px 0">${x.hits.map(([t, w]) => `<li><b>${esc(t)}</b> … ${esc(w)}</li>`).join("")}</ul><div class="sm">おすすめ技: ${x.mv.map(esc).join("・")}</div></div></div></div>`;
      const band = (lo, hi) => D.syn.filter((x) => { const r = ["F", "E", "D", "C", "B", "A", "S", "SS", "X"].indexOf(x.r); return r >= lo && r <= hi; });
      el.innerHTML = `<h2><span class="px">GUIDE</span>おすすめの モンスター</h2>
      <h3>ストーリーで 手軽に 作れる 高ランク</h3>
      <p class="lead">野生で 会える 親どうしを 配合して 作れる A〜SSランクの モンスター。見出しの 地方は「その 地方までで 親が 2体とも そろう」と いう 意味。<b>奇跡の配合</b>なら 低い ランクの 親から 一気に 高い ランクが 生まれる。</p>
      ${regs.map((r) => `<h4 style="margin:14px 0 6px">${esc(r)} から</h4><div class="list">${D.story.filter((x) => x.reg === r).map(st).join("")}</div>`).join("")}
      <h3>特性が かみ合う モンスター</h3>
      <p class="lead">おすすめの 技と 特性が おたがいを 強く する モンスター。特性は 個体ごとに 入れかわる ことが あるので、図鑑の「◇ 相性◎の 候補」も 見よう。</p>
      <h4 style="margin:14px 0 6px">序盤（F〜C）</h4><div class="list">${band(0, 3).map(sy).join("")}</div>
      <h4 style="margin:14px 0 6px">中盤（B〜A）</h4><div class="list">${band(4, 5).map(sy).join("")}</div>
      <h4 style="margin:14px 0 6px">終盤（S〜SS）</h4><div class="list">${band(6, 7).map(sy).join("")}</div>
      <div class="grid" style="margin-top:12px">${gcard("おすすめの 育て方")}${gcard("組み合わせの 例")}</div>`;
    },
  };
  function paged(el, listSel, moreSel, cntSel, filter, card, inputs, unit) {
    let rows = [], shown = 0; const STEP = 40;
    const list = $(listSel, el), more = $(moreSel, el), cnt = $(cntSel, el);
    const render = (reset) => {
      if (reset) { rows = filter(); shown = 0; list.innerHTML = ""; }
      const next = rows.slice(shown, shown + STEP); shown += next.length;
      list.insertAdjacentHTML("beforeend", next.map(card).join(""));
      cnt.textContent = `${rows.length}${unit}`; more.hidden = shown >= rows.length;
    };
    let tm; for (const s of inputs) { const n = $(s, el); n.addEventListener(n.tagName === "INPUT" ? "input" : "change", () => { clearTimeout(tm); tm = setTimeout(() => render(true), 120); }); }
    more.onclick = () => render(false);
    render(true);
  }
  go(location.hash.slice(1) || "home", false);
}
})();
</script>
